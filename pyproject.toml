[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-review-assistant"
version = "0.1.0"
description = "Evidence-first local pull request review assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Portfolio project" }]
dependencies = []

[project.scripts]
pr-review = "pr_review.cli:main"
pr-review-web = "pr_review.web:main"

[tool.setuptools.packages.find]
where = ["src"]
